name: Build APK

# 手动触发，或推送到 main 自动打包
on:
  workflow_dispatch:
  push:
    branches: [main]

# 允许用内置 GITHUB_TOKEN 创建 Release
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK 不用单独装：ubuntu-latest 镜像已预装（ANDROID_HOME + licenses 均就绪），
      # 缺的平台包 Gradle 会自动下载。
      # 也不可用 android-actions/setup-android@v3 —— 它会尝试安装已被 Google 下架的
      # `tools` 包，必然失败（Warning: Failed to find package 'tools'）。

      - name: 安装依赖并构建网页
        run: |
          npm ci
          npm run build

      # android/ 工程不进仓库，每次在 CI 里现生成，保持仓库干净
      - name: 生成安卓工程
        run: |
          npx cap add android
          npx cap sync

      # 版本延续：versionName 取 package.json（发版时改它），versionCode 取
      # run_number（每次构建单调递增），保证新包能覆盖安装旧包。
      - name: 写入版本号
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "versionName=$VERSION versionCode=$CODE"

      # 签名延续：不再依赖 AGP 对 ~/.android/debug.keystore 的自动发现（实测它会
      # 因读不了 openssl 生成的 PKCS12 而静默换随机钥匙），而是在 gradle 里显式
      # 指定签名配置，每次构建用同一把钥匙。
      - name: 写入稳定签名并显式配置
        run: |
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > android/cd-debug.keystore
          keytool -list -keystore android/cd-debug.keystore -storepass android -alias androiddebugkey >/dev/null \
            && echo "✓ 固定钥匙可读" || (echo "✗ 固定钥匙不可读！" && exit 1)
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  cd {
                      storeFile rootProject.file("cd-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.cd
                  }
              }
          }
          GRADLE

      - name: 打包 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 校验签名指纹（与固定钥匙不一致则构建失败）
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > /tmp/certs.txt
          cat /tmp/certs.txt
          EXPECT=$(echo "FF:B9:EA:E5:14:AE:5D:13:A6:3D:3D:9E:C5:ED:0D:E0:B3:4A:65:94:4F:85:07:A8:31:08:61:AB:05:B6:92:C3" | tr -d ':' | tr 'A-Z' 'a-z')
          grep -qi "$EXPECT" /tmp/certs.txt \
            && echo "✓ 签名与固定钥匙一致" \
            || (echo "✗ 签名不匹配！" && exit 1)

      - name: 上传 APK（Artifacts，需登录下载）
        uses: actions/upload-artifact@v4
        with:
          name: whim-diary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 发布到 Releases：仓库页直接可下载（公开仓库无需任何登录）
      - name: 发布到 Releases
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "奇想日记-v$VERSION.apk"
          gh release create "v$VERSION" "奇想日记-v$VERSION.apk" \
            --title "v$VERSION" \
            --notes "versionCode=$CODE 自动构建" \
            || gh release upload "v$VERSION" "奇想日记-v$VERSION.apk" --clobber
        env:
          VERSION: ${{ env.APP_VERSION }}
          CODE: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
