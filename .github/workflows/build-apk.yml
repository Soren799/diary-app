name: Build APK

# 手动触发，或推送到 main 自动打包
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 装命令行工具 + 预接受 license，Gradle 首跑会自动补齐缺的平台包
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖并构建网页
        run: |
          npm ci
          npm run build

      # android/ 工程不进仓库，每次在 CI 里现生成，保持仓库干净
      - name: 生成安卓工程
        run: |
          npx cap add android
          npx cap sync

      - name: 打包 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: whim-diary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
