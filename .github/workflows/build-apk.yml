name: Build APK

# 手动触发，或推送到 main 自动打包
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK 不用单独装：ubuntu-latest 镜像已预装（ANDROID_HOME + licenses 均就绪），
      # 缺的平台包 Gradle 会自动下载。
      # 也不可用 android-actions/setup-android@v3 —— 它会尝试安装已被 Google 下架的
      # `tools` 包，必然失败（Warning: Failed to find package 'tools'）。

      - name: 安装依赖并构建网页
        run: |
          npm ci
          npm run build

      # android/ 工程不进仓库，每次在 CI 里现生成，保持仓库干净
      - name: 生成安卓工程
        run: |
          npx cap add android
          npx cap sync

      - name: 打包 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: whim-diary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
